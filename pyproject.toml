[project]
name = "personal-assistant"
version = "0.1.0"
description = "Локальный личный ассистент: бриф дня + чат-бот база знаний по Telegram/Gmail"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "google-api-python-client>=2.130",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.3",
    "apscheduler>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
